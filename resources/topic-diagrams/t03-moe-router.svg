      <path d="M 700 206 L 760 220" stroke="#38bdf8" stroke-width="3" marker-end="url(#arrow)" fill="none"/>
      <path d="M 700 302 L 760 240" stroke="#38bdf8" stroke-width="3" marker-end="url(#arrow)" fill="none"/>
      <text x="88" y="322" text-anchor="start" fill="#facc15" font-size="14" font-weight="800" font-family="Inter, Microsoft YaHei, Segoe UI, sans-serif">总参数占显存</text>
      <text x="560" y="322" text-anchor="start" fill="#5eead4" font-size="14" font-weight="800" font-family="Inter, Microsoft YaHei, Segoe UI, sans-serif">激活参数决定每 token 计算量</text>
    
  <text x="48" y="372" text-anchor="start" fill="#94a3b8" font-size="13" font-weight="500" font-family="Inter, Microsoft YaHei, Segoe UI, sans-serif">专家读图：MoE 省的是每 token 计算，不自动省掉所有常驻权重和通信。</text>
</svg>
