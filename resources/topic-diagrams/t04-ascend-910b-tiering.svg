<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-labelledby="title desc">
  <title id="title">Ascend 910B系列硬件规格与分级策略 图解</title>
  <desc id="desc">硬件分级不是贴标签，而是把模型的显存、带宽和延迟画像放到合适的卡上。</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#38bdf8"/>
    </marker>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
  </defs>
  <rect width="960" height="420" fill="url(#bg)"/>
  <rect x="24" y="24" width="912" height="372" rx="10" fill="#0b1220" stroke="#263143"/>
  <text x="48" y="70" text-anchor="start" fill="#5eead4" font-size="18" font-weight="900" font-family="Inter, Microsoft YaHei, Segoe UI, sans-serif">T04</text>
  <text x="98" y="70" text-anchor="start" fill="#f8fafc" font-size="22" font-weight="900" font-family="Inter, Microsoft YaHei, Segoe UI, sans-serif">Ascend 910B系列硬件规格与分级策略</text>
  <text x="48" y="104" text-anchor="start" fill="#cbd5e1" font-size="15" font-weight="600" font-family="Inter, Microsoft YaHei, Segoe UI, sans-serif">硬件分级不是贴标签，而是把模型的显存、带宽和延迟画像放到合适的卡上。</text>
  <rect x="742" y="42" width="166" height="30" rx="999" fill="#102033" stroke="#5eead4" opacity="1"/>
  <text x="825" y="63" text-anchor="middle" fill="#5eead4" font-size="12" font-weight="900" font-family="Inter, Microsoft YaHei, Segoe UI, sans-serif">专家读图：问题→机制→决策</text>
  
      <rect x="74" y="142" width="210" height="142" rx="8" fill="#101b2d" stroke="#5eead4" opacity="1"/>
<text x="179" y="209" text-anchor="middle" fill="#f8fafc" font-size="15" font-weight="800" font-family="Inter, Microsoft YaHei, Segoe UI, sans-serif">910B3 资源池</text>
<text x="179" y="231" text-anchor="middle" fill="#93c5fd" font-size="12" font-weight="600" font-family="Inter, Microsoft YaHei, Segoe UI, sans-serif">容量余量 / 长上下文</text>
      <rect x="328" y="142" width="210" height="142" rx="8" fill="#101b2d" stroke="#60a5fa" opacity="1"/>
<text x="433" y="209" text-anchor="middle" fill="#f8fafc" font-size="15" font-weight="800" font-family="Inter, Microsoft YaHei, Segoe UI, sans-serif">910B4 资源池</text>
<text x="433" y="231" text-anchor="middle" fill="#93c5fd" font-size="12" font-weight="600" font-family="Inter, Microsoft YaHei, Segoe UI, sans-serif">成本优先 / 轻量服务</text>
      <rect x="620" y="112" width="210" height="34" rx="8" fill="#101b2d" stroke="#facc15" opacity="1"/>
<text x="725" y="134" text-anchor="middle" fill="#f8fafc" font-size="15" font-weight="800" font-family="Inter, Microsoft YaHei, Segoe UI, sans-serif">权重+KV</text>
<rect x="620" y="158" width="210" height="34" rx="8" fill="#101b2d" stroke="#34d399" opacity="1"/>
<text x="725" y="180" text-anchor="middle" fill="#f8fafc" font-size="15" font-weight="800" font-family="Inter, Microsoft YaHei, Segoe UI, sans-serif">HBM带宽</text>
<rect x="620" y="204" width="210" height="34" rx="8" fill="#101b2d" stroke="#38bdf8" opacity="1"/>
<text x="725" y="226" text-anchor="middle" fill="#f8fafc" font-size="15" font-weight="800" font-family="Inter, Microsoft YaHei, Segoe UI, sans-serif">互联/故障域</text>
<rect x="620" y="250" width="210" height="34" rx="8" fill="#101b2d" stroke="#a78bfa" opacity="1"/>
<text x="725" y="272" text-anchor="middle" fill="#f8fafc" font-size="15" font-weight="800" font-family="Inter, Microsoft YaHei, Segoe UI, sans-serif">CANN/kernel</text>
<rect x="620" y="296" width="210" height="34" rx="8" fill="#101b2d" stroke="#fb7185" opacity="1"/>
<text x="725" y="318" text-anchor="middle" fill="#f8fafc" font-size="15" font-weight="800" font-family="Inter, Microsoft YaHei, Segoe UI, sans-serif">SLA/成本</text>

      <path d="M 284 213 L 620 129" stroke="#38bdf8" stroke-width="3" marker-end="url(#arrow)" fill="none"/><path d="M 538 213 L 620 175" stroke="#38bdf8" stroke-width="3" marker-end="url(#arrow)" fill="none"/>
      <path d="M 538 213 L 620 221" stroke="#38bdf8" stroke-width="3" marker-end="url(#arrow)" fill="none"/><path d="M 538 213 L 620 267" stroke="#38bdf8" stroke-width="3" marker-end="url(#arrow)" fill="none"/><path d="M 284 213 L 620 313" stroke="#38bdf8" stroke-width="3" marker-end="url(#arrow)" fill="none"/>
      <text x="306" y="330" text-anchor="start" fill="#cbd5e1" font-size="14" font-weight="800" font-family="Inter, Microsoft YaHei, Segoe UI, sans-serif">分级不是只看 64GB vs 32GB：要用实测水位和SLA校准</text>
    
  <text x="48" y="372" text-anchor="start" fill="#94a3b8" font-size="13" font-weight="500" font-family="Inter, Microsoft YaHei, Segoe UI, sans-serif">专家读图：硬件分级要同时看容量、带宽、互联、软件栈和业务成本。</text>
