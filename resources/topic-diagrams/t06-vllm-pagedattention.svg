<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-labelledby="title desc">
  <title id="title">vLLM核心机制 图解</title>
  <desc id="desc">vLLM 的关键不是“更快地算一个请求”，而是“更聪明地把很多请求塞进同一台推理机器”。</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#38bdf8"/>
    </marker>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
  </defs>
  <rect width="960" height="420" fill="url(#bg)"/>
  <rect x="24" y="24" width="912" height="372" rx="10" fill="#0b1220" stroke="#263143"/>
  <text x="48" y="70" text-anchor="start" fill="#5eead4" font-size="18" font-weight="900" font-family="Inter, Microsoft YaHei, Segoe UI, sans-serif">T06</text>
  <text x="98" y="70" text-anchor="start" fill="#f8fafc" font-size="22" font-weight="900" font-family="Inter, Microsoft YaHei, Segoe UI, sans-serif">vLLM核心机制</text>
  <text x="48" y="104" text-anchor="start" fill="#cbd5e1" font-size="15" font-weight="600" font-family="Inter, Microsoft YaHei, Segoe UI, sans-serif">vLLM 的关键不是“更快地算一个请求”，而是“更聪明地把很多请求塞进同一台推理机器”。</text>
  
      <rect x="58" y="150" width="150" height="74" rx="8" fill="#101b2d" stroke="#60a5fa" opacity="1"/>
<text x="133" y="183" text-anchor="middle" fill="#f8fafc" font-size="15" font-weight="800" font-family="Inter, Microsoft YaHei, Segoe UI, sans-serif">请求队列</text>
<text x="133" y="205" text-anchor="middle" fill="#93c5fd" font-size="12" font-weight="600" font-family="Inter, Microsoft YaHei, Segoe UI, sans-serif">不同长度</text>
      <path d="M 208 187 L 290 187" stroke="#38bdf8" stroke-width="3" marker-end="url(#arrow)" fill="none"/>
      <rect x="290" y="150" width="150" height="74" rx="8" fill="#101b2d" stroke="#5eead4" opacity="1"/>
<text x="365" y="183" text-anchor="middle" fill="#f8fafc" font-size="15" font-weight="800" font-family="Inter, Microsoft YaHei, Segoe UI, sans-serif">Scheduler</text>
<text x="365" y="205" text-anchor="middle" fill="#93c5fd" font-size="12" font-weight="600" font-family="Inter, Microsoft YaHei, Segoe UI, sans-serif">continuous batching</text>
