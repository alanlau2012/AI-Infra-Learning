      <path d="M 660 290 L 660 306" stroke="#38bdf8" stroke-width="3" marker-end="url(#arrow)" fill="none"/>
    
  <text x="48" y="372" text-anchor="start" fill="#94a3b8" font-size="13" font-weight="500" font-family="Inter, Microsoft YaHei, Segoe UI, sans-serif">读图：vLLM 像 KV Cache 的操作系统，用分页和连续调度减少浪费。</text>
