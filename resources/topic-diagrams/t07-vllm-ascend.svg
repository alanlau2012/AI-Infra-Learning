      <rect x="120" y="278" width="210" height="54" rx="8" fill="#101b2d" stroke="#38bdf8" opacity="1"/>
<text x="225" y="301" text-anchor="middle" fill="#f8fafc" font-size="15" font-weight="800" font-family="Inter, Microsoft YaHei, Segoe UI, sans-serif">保持上游接口</text>
<text x="225" y="323" text-anchor="middle" fill="#93c5fd" font-size="12" font-weight="600" font-family="Inter, Microsoft YaHei, Segoe UI, sans-serif">减少升级成本</text>
      <rect x="630" y="278" width="210" height="54" rx="8" fill="#101b2d" stroke="#34d399" opacity="1"/>
