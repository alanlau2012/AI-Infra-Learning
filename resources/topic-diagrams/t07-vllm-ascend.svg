      <rect x="72" y="142" width="176" height="70" rx="8" fill="#101b2d" stroke="#5eead4" opacity="1"/>
<text x="160" y="173" text-anchor="middle" fill="#f8fafc" font-size="15" font-weight="800" font-family="Inter, Microsoft YaHei, Segoe UI, sans-serif">vLLM 语义</text>
<text x="160" y="195" text-anchor="middle" fill="#93c5fd" font-size="12" font-weight="600" font-family="Inter, Microsoft YaHei, Segoe UI, sans-serif">API / scheduler / KV</text>
      <rect x="392" y="142" width="176" height="70" rx="8" fill="#101b2d" stroke="#facc15" opacity="1"/>
