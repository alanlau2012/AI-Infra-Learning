<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-labelledby="title desc">
  <title id="title">Prefill/Decode分离与4P4D架构 图解</title>
  <desc id="desc">P/D 分离的核心，是让“读长 prompt”和“逐 token 生成”不要在同一条队列里互相拖累。</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#38bdf8"/>
    </marker>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
  </defs>
  <rect width="960" height="420" fill="url(#bg)"/>
  <rect x="24" y="24" width="912" height="372" rx="10" fill="#0b1220" stroke="#263143"/>
  <text x="48" y="70" text-anchor="start" fill="#5eead4" font-size="18" font-weight="900" font-family="Inter, Microsoft YaHei, Segoe UI, sans-serif">T08</text>
  <text x="98" y="70" text-anchor="start" fill="#f8fafc" font-size="22" font-weight="900" font-family="Inter, Microsoft YaHei, Segoe UI, sans-serif">Prefill/Decode分离与4P4D架构</text>
  <text x="48" y="104" text-anchor="start" fill="#cbd5e1" font-size="15" font-weight="600" font-family="Inter, Microsoft YaHei, Segoe UI, sans-serif">P/D 分离的核心，是让“读长 prompt”和“逐 token 生成”不要在同一条队列里互相拖累。</text>
  <rect x="742" y="42" width="166" height="30" rx="999" fill="#102033" stroke="#5eead4" opacity="1"/>
  <text x="825" y="63" text-anchor="middle" fill="#5eead4" font-size="12" font-weight="900" font-family="Inter, Microsoft YaHei, Segoe UI, sans-serif">专家读图：问题→机制→决策</text>
  
      <rect x="72" y="148" width="250" height="120" rx="8" fill="#101b2d" stroke="#5eead4" opacity="1"/>
<text x="197" y="204" text-anchor="middle" fill="#f8fafc" font-size="15" font-weight="800" font-family="Inter, Microsoft YaHei, Segoe UI, sans-serif">Prefill Pool</text>
<text x="197" y="226" text-anchor="middle" fill="#93c5fd" font-size="12" font-weight="600" font-family="Inter, Microsoft YaHei, Segoe UI, sans-serif">长 prompt / 高并行 / TTFT</text>
      <rect x="638" y="148" width="250" height="120" rx="8" fill="#101b2d" stroke="#60a5fa" opacity="1"/>
<text x="763" y="204" text-anchor="middle" fill="#f8fafc" font-size="15" font-weight="800" font-family="Inter, Microsoft YaHei, Segoe UI, sans-serif">Decode Pool</text>
<text x="763" y="226" text-anchor="middle" fill="#93c5fd" font-size="12" font-weight="600" font-family="Inter, Microsoft YaHei, Segoe UI, sans-serif">逐 token / 低 ITL / 稳定节奏</text>
      <path d="M 322 208 L 638 208" stroke="#facc15" stroke-width="4" marker-end="url(#arrow)" fill="none"/>
      <text x="480" y="190" text-anchor="middle" fill="#facc15" font-size="14" font-weight="900" font-family="Inter, Microsoft YaHei, Segoe UI, sans-serif">KV connector / transport</text>
      <path d="M 638 236 L 322 236" stroke="#34d399" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#arrow)" fill="none"/>
      <text x="480" y="258" text-anchor="middle" fill="#bbf7d0" font-size="13" font-weight="800" font-family="Inter, Microsoft YaHei, Segoe UI, sans-serif">Decode ACK + backpressure</text>
      <rect x="104" y="226" width="34" height="18" rx="8" fill="#064e3b" stroke="#34d399" opacity="1"/><rect x="150" y="226" width="34" height="18" rx="8" fill="#064e3b" stroke="#34d399" opacity="1"/><rect x="196" y="226" width="34" height="18" rx="8" fill="#064e3b" stroke="#34d399" opacity="1"/><rect x="242" y="226" width="34" height="18" rx="8" fill="#064e3b" stroke="#34d399" opacity="1"/>
      <rect x="672" y="226" width="34" height="18" rx="8" fill="#172554" stroke="#60a5fa" opacity="1"/><rect x="718" y="226" width="34" height="18" rx="8" fill="#172554" stroke="#60a5fa" opacity="1"/><rect x="764" y="226" width="34" height="18" rx="8" fill="#172554" stroke="#60a5fa" opacity="1"/><rect x="810" y="226" width="34" height="18" rx="8" fill="#172554" stroke="#60a5fa" opacity="1"/>
      <rect x="326" y="304" width="150" height="46" rx="8" fill="#101b2d" stroke="#38bdf8" opacity="1"/>
<text x="401" y="323" text-anchor="middle" fill="#f8fafc" font-size="15" font-weight="800" font-family="Inter, Microsoft YaHei, Segoe UI, sans-serif">水位反馈</text>
<text x="401" y="345" text-anchor="middle" fill="#93c5fd" font-size="12" font-weight="600" font-family="Inter, Microsoft YaHei, Segoe UI, sans-serif">queue / KV</text>
      <rect x="500" y="304" width="150" height="46" rx="8" fill="#101b2d" stroke="#a78bfa" opacity="1"/>
<text x="575" y="323" text-anchor="middle" fill="#f8fafc" font-size="15" font-weight="800" font-family="Inter, Microsoft YaHei, Segoe UI, sans-serif">P:D 重平衡</text>
<text x="575" y="345" text-anchor="middle" fill="#93c5fd" font-size="12" font-weight="600" font-family="Inter, Microsoft YaHei, Segoe UI, sans-serif">由流量画像决定</text>
    
  <text x="48" y="372" text-anchor="start" fill="#94a3b8" font-size="13" font-weight="500" font-family="Inter, Microsoft YaHei, Segoe UI, sans-serif">专家读图：P/D 分离难点在 KV 传输、ACK、反压和动态配比闭环。</text>
</svg>
