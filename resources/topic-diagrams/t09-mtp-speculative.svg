<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-labelledby="title desc">
  <title id="title">MTP投机推理 图解</title>
  <desc id="desc">MTP 的直觉是：既然 Decode 每步搬权重很贵，那就尝试一次多猜几个 token，再由主模型验收。</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#38bdf8"/>
    </marker>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
  </defs>
  <rect width="960" height="420" fill="url(#bg)"/>
  <rect x="24" y="24" width="912" height="372" rx="10" fill="#0b1220" stroke="#263143"/>
  <text x="48" y="70" text-anchor="start" fill="#5eead4" font-size="18" font-weight="900" font-family="Inter, Microsoft YaHei, Segoe UI, sans-serif">T09</text>
  <text x="98" y="70" text-anchor="start" fill="#f8fafc" font-size="22" font-weight="900" font-family="Inter, Microsoft YaHei, Segoe UI, sans-serif">MTP投机推理</text>
  <text x="48" y="104" text-anchor="start" fill="#cbd5e1" font-size="15" font-weight="600" font-family="Inter, Microsoft YaHei, Segoe UI, sans-serif">MTP 的直觉是：既然 Decode 每步搬权重很贵，那就尝试一次多猜几个 token，再由主模型验收。</text>
  
      <rect x="80" y="154" width="170" height="66" rx="8" fill="#101b2d" stroke="#5eead4" opacity="1"/>
<text x="165" y="183" text-anchor="middle" fill="#f8fafc" font-size="15" font-weight="800" font-family="Inter, Microsoft YaHei, Segoe UI, sans-serif">MTP / Draft</text>
<text x="165" y="205" text-anchor="middle" fill="#93c5fd" font-size="12" font-weight="600" font-family="Inter, Microsoft YaHei, Segoe UI, sans-serif">一次猜多步</text>
      <path d="M 250 187 L 380 187" stroke="#38bdf8" stroke-width="3" marker-end="url(#arrow)" fill="none"/>
      <rect x="380" y="138" width="202" height="98" rx="8" fill="#101b2d" stroke="#facc15" opacity="1"/>
<text x="481" y="183" text-anchor="middle" fill="#f8fafc" font-size="15" font-weight="800" font-family="Inter, Microsoft YaHei, Segoe UI, sans-serif">Target Verify</text>
<text x="481" y="205" text-anchor="middle" fill="#93c5fd" font-size="12" font-weight="600" font-family="Inter, Microsoft YaHei, Segoe UI, sans-serif">主模型并行验收</text>
      <path d="M 582 170 L 722 150" stroke="#34d399" stroke-width="3" marker-end="url(#arrow)" fill="none"/>
      <path d="M 582 206 L 722 248" stroke="#fb7185" stroke-width="3" stroke-dasharray="6 6" marker-end="url(#arrow)" fill="none"/>
      <rect x="722" y="118" width="154" height="60" rx="8" fill="#101b2d" stroke="#34d399" opacity="1"/>
<text x="799" y="144" text-anchor="middle" fill="#f8fafc" font-size="15" font-weight="800" font-family="Inter, Microsoft YaHei, Segoe UI, sans-serif">Accept</text>
<text x="799" y="166" text-anchor="middle" fill="#93c5fd" font-size="12" font-weight="600" font-family="Inter, Microsoft YaHei, Segoe UI, sans-serif">直接输出</text>
      <rect x="722" y="226" width="154" height="60" rx="8" fill="#101b2d" stroke="#fb7185" opacity="1"/>
<text x="799" y="252" text-anchor="middle" fill="#f8fafc" font-size="15" font-weight="800" font-family="Inter, Microsoft YaHei, Segoe UI, sans-serif">Reject</text>
<text x="799" y="274" text-anchor="middle" fill="#93c5fd" font-size="12" font-weight="600" font-family="Inter, Microsoft YaHei, Segoe UI, sans-serif">回退续写</text>
      <circle cx="118" cy="274" r="10" fill="#172554" stroke="#60a5fa" stroke-width="2"/>
<text x="118" y="279" text-anchor="middle" fill="#f8fafc" font-size="14" font-weight="800" font-family="Inter, Microsoft YaHei, Segoe UI, sans-serif">1</text><circle cx="148" cy="274" r="10" fill="#172554" stroke="#60a5fa" stroke-width="2"/>
<text x="148" y="279" text-anchor="middle" fill="#f8fafc" font-size="14" font-weight="800" font-family="Inter, Microsoft YaHei, Segoe UI, sans-serif">2</text><circle cx="178" cy="274" r="10" fill="#172554" stroke="#60a5fa" stroke-width="2"/>
<text x="178" y="279" text-anchor="middle" fill="#f8fafc" font-size="14" font-weight="800" font-family="Inter, Microsoft YaHei, Segoe UI, sans-serif">3</text><circle cx="208" cy="274" r="10" fill="#172554" stroke="#60a5fa" stroke-width="2"/>
<text x="208" y="279" text-anchor="middle" fill="#f8fafc" font-size="14" font-weight="800" font-family="Inter, Microsoft YaHei, Segoe UI, sans-serif">4</text><circle cx="238" cy="274" r="10" fill="#172554" stroke="#60a5fa" stroke-width="2"/>
<text x="238" y="279" text-anchor="middle" fill="#f8fafc" font-size="14" font-weight="800" font-family="Inter, Microsoft YaHei, Segoe UI, sans-serif">5</text>
      <text x="82" y="318" text-anchor="start" fill="#cbd5e1" font-size="14" font-weight="800" font-family="Inter, Microsoft YaHei, Segoe UI, sans-serif">收益取决于平均接受 token 数，而不是“开了投机”四个字。</text>
    
  <text x="48" y="372" text-anchor="start" fill="#94a3b8" font-size="13" font-weight="500" font-family="Inter, Microsoft YaHei, Segoe UI, sans-serif">读图：投机推理用候选 token 换更少主模型 decode 步数。</text>
</svg>
