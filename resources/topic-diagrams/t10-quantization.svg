<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-labelledby="title desc">
  <title id="title">量化技术与硬件分级选型 图解</title>
  <desc id="desc">量化不是把数字变小这么简单，而是在显存、带宽、速度和精度之间做可验证的交换。</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#38bdf8"/>
    </marker>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
  </defs>
  <rect width="960" height="420" fill="url(#bg)"/>
  <rect x="24" y="24" width="912" height="372" rx="10" fill="#0b1220" stroke="#263143"/>
  <text x="48" y="70" text-anchor="start" fill="#5eead4" font-size="18" font-weight="900" font-family="Inter, Microsoft YaHei, Segoe UI, sans-serif">T10</text>
  <text x="98" y="70" text-anchor="start" fill="#f8fafc" font-size="22" font-weight="900" font-family="Inter, Microsoft YaHei, Segoe UI, sans-serif">量化技术与硬件分级选型</text>
  <text x="48" y="104" text-anchor="start" fill="#cbd5e1" font-size="15" font-weight="600" font-family="Inter, Microsoft YaHei, Segoe UI, sans-serif">量化不是把数字变小这么简单，而是在显存、带宽、速度和精度之间做可验证的交换。</text>
  <rect x="742" y="42" width="166" height="30" rx="999" fill="#102033" stroke="#5eead4" opacity="1"/>
  <text x="825" y="63" text-anchor="middle" fill="#5eead4" font-size="12" font-weight="900" font-family="Inter, Microsoft YaHei, Segoe UI, sans-serif">专家读图：问题→机制→决策</text>
  
      <rect x="120" y="144" width="280" height="34" rx="8" fill="#101b2d" stroke="#60a5fa" opacity="1"/><text x="260" y="168" text-anchor="middle" fill="#dbe7f6" font-size="14" font-weight="900" font-family="Inter, Microsoft YaHei, Segoe UI, sans-serif">FP16/BF16</text><rect x="162" y="192" width="238" height="34" rx="8" fill="#101b2d" stroke="#5eead4" opacity="1"/><text x="260" y="216" text-anchor="middle" fill="#dbe7f6" font-size="14" font-weight="900" font-family="Inter, Microsoft YaHei, Segoe UI, sans-serif">FP8</text><rect x="204" y="240" width="196" height="34" rx="8" fill="#101b2d" stroke="#facc15" opacity="1"/><text x="260" y="264" text-anchor="middle" fill="#dbe7f6" font-size="14" font-weight="900" font-family="Inter, Microsoft YaHei, Segoe UI, sans-serif">INT8</text><rect x="246" y="288" width="154" height="34" rx="8" fill="#101b2d" stroke="#fb7185" opacity="1"/><text x="260" y="312" text-anchor="middle" fill="#dbe7f6" font-size="14" font-weight="900" font-family="Inter, Microsoft YaHei, Segoe UI, sans-serif">INT4 / FP4</text>
      <path d="M 454 160 L 662 160" stroke="#38bdf8" stroke-width="3" marker-end="url(#arrow)" fill="none"/><path d="M 454 304 L 662 304" stroke="#38bdf8" stroke-width="3" marker-end="url(#arrow)" fill="none"/>
      <rect x="662" y="132" width="190" height="58" rx="8" fill="#101b2d" stroke="#34d399" opacity="1"/>
<text x="757" y="157" text-anchor="middle" fill="#f8fafc" font-size="15" font-weight="800" font-family="Inter, Microsoft YaHei, Segoe UI, sans-serif">显存/带宽下降</text>
<text x="757" y="179" text-anchor="middle" fill="#93c5fd" font-size="12" font-weight="600" font-family="Inter, Microsoft YaHei, Segoe UI, sans-serif">更容易放下</text>
      <rect x="662" y="276" width="190" height="58" rx="8" fill="#101b2d" stroke="#fb7185" opacity="1"/>
<text x="757" y="301" text-anchor="middle" fill="#f8fafc" font-size="15" font-weight="800" font-family="Inter, Microsoft YaHei, Segoe UI, sans-serif">精度/适配风险上升</text>
<text x="757" y="323" text-anchor="middle" fill="#93c5fd" font-size="12" font-weight="600" font-family="Inter, Microsoft YaHei, Segoe UI, sans-serif">需要业务评测</text>
      <rect x="322" y="310" width="190" height="44" rx="8" fill="#101b2d" stroke="#38bdf8" opacity="1"/>
<text x="417" y="328" text-anchor="middle" fill="#f8fafc" font-size="15" font-weight="800" font-family="Inter, Microsoft YaHei, Segoe UI, sans-serif">KV Quant</text>
<text x="417" y="350" text-anchor="middle" fill="#93c5fd" font-size="12" font-weight="600" font-family="Inter, Microsoft YaHei, Segoe UI, sans-serif">长上下文并发</text>
    
  <text x="48" y="372" text-anchor="start" fill="#94a3b8" font-size="13" font-weight="500" font-family="Inter, Microsoft YaHei, Segoe UI, sans-serif">专家读图：量化是显存、带宽、速度和质量之间的交换。</text>
</svg>
