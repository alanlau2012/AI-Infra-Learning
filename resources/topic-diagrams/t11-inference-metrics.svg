<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-labelledby="title desc">
  <title id="title">推理服务指标体系 图解</title>
  <desc id="desc">推理服务指标不能只看 token/s；用户感知的是等待首字、生成节奏和失败率。</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#38bdf8"/>
    </marker>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
  </defs>
  <rect width="960" height="420" fill="url(#bg)"/>
  <rect x="24" y="24" width="912" height="372" rx="10" fill="#0b1220" stroke="#263143"/>
  <text x="48" y="70" text-anchor="start" fill="#5eead4" font-size="18" font-weight="900" font-family="Inter, Microsoft YaHei, Segoe UI, sans-serif">T11</text>
  <text x="98" y="70" text-anchor="start" fill="#f8fafc" font-size="22" font-weight="900" font-family="Inter, Microsoft YaHei, Segoe UI, sans-serif">推理服务指标体系</text>
  <text x="48" y="104" text-anchor="start" fill="#cbd5e1" font-size="15" font-weight="600" font-family="Inter, Microsoft YaHei, Segoe UI, sans-serif">推理服务指标不能只看 token/s；用户感知的是等待首字、生成节奏和失败率。</text>
  <rect x="742" y="42" width="166" height="30" rx="999" fill="#102033" stroke="#5eead4" opacity="1"/>
  <text x="825" y="63" text-anchor="middle" fill="#5eead4" font-size="12" font-weight="900" font-family="Inter, Microsoft YaHei, Segoe UI, sans-serif">专家读图：问题→机制→决策</text>
  
      <circle cx="480" cy="168" r="42" fill="#064e3b" stroke="#5eead4" stroke-width="2"/>
<text x="480" y="173" text-anchor="middle" fill="#f8fafc" font-size="14" font-weight="800" font-family="Inter, Microsoft YaHei, Segoe UI, sans-serif">SLO</text>
      <path d="M 480 210 L 160 256" stroke="#475569" stroke-width="2" marker-end="url(#arrow)" fill="none"/><rect x="90" y="256" width="140" height="58" rx="8" fill="#101b2d" stroke="#60a5fa" opacity="1"/>
<text x="160" y="281" text-anchor="middle" fill="#f8fafc" font-size="15" font-weight="800" font-family="Inter, Microsoft YaHei, Segoe UI, sans-serif">TTFT 首字</text>
<text x="160" y="303" text-anchor="middle" fill="#93c5fd" font-size="12" font-weight="600" font-family="Inter, Microsoft YaHei, Segoe UI, sans-serif">用户体验</text><path d="M 480 210 L 320 220" stroke="#475569" stroke-width="2" marker-end="url(#arrow)" fill="none"/><rect x="250" y="220" width="140" height="58" rx="8" fill="#101b2d" stroke="#60a5fa" opacity="1"/>
<text x="320" y="245" text-anchor="middle" fill="#f8fafc" font-size="15" font-weight="800" font-family="Inter, Microsoft YaHei, Segoe UI, sans-serif">ITL 节奏</text>
<text x="320" y="267" text-anchor="middle" fill="#93c5fd" font-size="12" font-weight="600" font-family="Inter, Microsoft YaHei, Segoe UI, sans-serif">用户体验</text><path d="M 480 210 L 480 256" stroke="#475569" stroke-width="2" marker-end="url(#arrow)" fill="none"/><rect x="410" y="256" width="140" height="58" rx="8" fill="#101b2d" stroke="#facc15" opacity="1"/>
<text x="480" y="281" text-anchor="middle" fill="#f8fafc" font-size="15" font-weight="800" font-family="Inter, Microsoft YaHei, Segoe UI, sans-serif">吞吐 tokens/s</text>
<text x="480" y="303" text-anchor="middle" fill="#93c5fd" font-size="12" font-weight="600" font-family="Inter, Microsoft YaHei, Segoe UI, sans-serif">平台效率</text><path d="M 480 210 L 640 220" stroke="#475569" stroke-width="2" marker-end="url(#arrow)" fill="none"/><rect x="570" y="220" width="140" height="58" rx="8" fill="#101b2d" stroke="#facc15" opacity="1"/>
<text x="640" y="245" text-anchor="middle" fill="#f8fafc" font-size="15" font-weight="800" font-family="Inter, Microsoft YaHei, Segoe UI, sans-serif">错误率</text>
<text x="640" y="267" text-anchor="middle" fill="#93c5fd" font-size="12" font-weight="600" font-family="Inter, Microsoft YaHei, Segoe UI, sans-serif">平台效率</text><path d="M 480 210 L 800 256" stroke="#475569" stroke-width="2" marker-end="url(#arrow)" fill="none"/><rect x="730" y="256" width="140" height="58" rx="8" fill="#101b2d" stroke="#facc15" opacity="1"/>
<text x="800" y="281" text-anchor="middle" fill="#f8fafc" font-size="15" font-weight="800" font-family="Inter, Microsoft YaHei, Segoe UI, sans-serif">成本/卡时</text>
<text x="800" y="303" text-anchor="middle" fill="#93c5fd" font-size="12" font-weight="600" font-family="Inter, Microsoft YaHei, Segoe UI, sans-serif">平台效率</text>
      <text x="480" y="344" text-anchor="middle" fill="#cbd5e1" font-size="14" font-weight="800" font-family="Inter, Microsoft YaHei, Segoe UI, sans-serif">看分布：P50 / P95 / P99，而不是只看平均值</text>
    
  <text x="48" y="372" text-anchor="start" fill="#94a3b8" font-size="13" font-weight="500" font-family="Inter, Microsoft YaHei, Segoe UI, sans-serif">专家读图：指标体系要同时解释用户体验和资源效率。</text>
</svg>
