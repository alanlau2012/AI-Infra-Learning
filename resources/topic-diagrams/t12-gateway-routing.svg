<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-labelledby="title desc">
  <title id="title">网关架构与跨集群智能路由 图解</title>
  <desc id="desc">网关不是简单转发器，而是 MaaS 平台把业务意图翻译成资源决策的大脑。</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#38bdf8"/>
    </marker>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
  </defs>
  <rect width="960" height="420" fill="url(#bg)"/>
  <rect x="24" y="24" width="912" height="372" rx="10" fill="#0b1220" stroke="#263143"/>
  <text x="48" y="70" text-anchor="start" fill="#5eead4" font-size="18" font-weight="900" font-family="Inter, Microsoft YaHei, Segoe UI, sans-serif">T12</text>
  <text x="98" y="70" text-anchor="start" fill="#f8fafc" font-size="22" font-weight="900" font-family="Inter, Microsoft YaHei, Segoe UI, sans-serif">网关架构与跨集群智能路由</text>
  <text x="48" y="104" text-anchor="start" fill="#cbd5e1" font-size="15" font-weight="600" font-family="Inter, Microsoft YaHei, Segoe UI, sans-serif">网关不是简单转发器，而是 MaaS 平台把业务意图翻译成资源决策的大脑。</text>
  <rect x="742" y="42" width="166" height="30" rx="999" fill="#102033" stroke="#5eead4" opacity="1"/>
  <text x="825" y="63" text-anchor="middle" fill="#5eead4" font-size="12" font-weight="900" font-family="Inter, Microsoft YaHei, Segoe UI, sans-serif">专家读图：问题→机制→决策</text>
  
      <rect x="60" y="172" width="140" height="74" rx="8" fill="#101b2d" stroke="#60a5fa" opacity="1"/>
<text x="130" y="205" text-anchor="middle" fill="#f8fafc" font-size="15" font-weight="800" font-family="Inter, Microsoft YaHei, Segoe UI, sans-serif">请求</text>
<text x="130" y="227" text-anchor="middle" fill="#93c5fd" font-size="12" font-weight="600" font-family="Inter, Microsoft YaHei, Segoe UI, sans-serif">模型/租户/SLA</text>
      <path d="M 200 209 L 300 209" stroke="#38bdf8" stroke-width="3" marker-end="url(#arrow)" fill="none"/>
      <rect x="300" y="132" width="240" height="156" rx="8" fill="#101b2d" stroke="#5eead4" opacity="1"/>
      <text x="420" y="162" text-anchor="middle" fill="#f8fafc" font-size="14" font-weight="900" font-family="Inter, Microsoft YaHei, Segoe UI, sans-serif">路由评分</text>
      <text x="330" y="192" text-anchor="start" fill="#cbd5e1" font-size="14" font-weight="700" font-family="Inter, Microsoft YaHei, Segoe UI, sans-serif">• 硬过滤/能力</text><text x="330" y="218" text-anchor="start" fill="#cbd5e1" font-size="14" font-weight="700" font-family="Inter, Microsoft YaHei, Segoe UI, sans-serif">• token预算</text><text x="330" y="244" text-anchor="start" fill="#cbd5e1" font-size="14" font-weight="700" font-family="Inter, Microsoft YaHei, Segoe UI, sans-serif">• 归一化负载</text><text x="330" y="270" text-anchor="start" fill="#cbd5e1" font-size="14" font-weight="700" font-family="Inter, Microsoft YaHei, Segoe UI, sans-serif">• 指标新鲜度</text>
      <path d="M 540 209 L 640 172" stroke="#38bdf8" stroke-width="3" marker-end="url(#arrow)" fill="none"/><path d="M 540 209 L 640 246" stroke="#38bdf8" stroke-width="3" marker-end="url(#arrow)" fill="none"/>
      <rect x="640" y="136" width="220" height="58" rx="8" fill="#101b2d" stroke="#34d399" opacity="1"/>
<text x="750" y="161" text-anchor="middle" fill="#f8fafc" font-size="15" font-weight="800" font-family="Inter, Microsoft YaHei, Segoe UI, sans-serif">Cluster A</text>
<text x="750" y="183" text-anchor="middle" fill="#93c5fd" font-size="12" font-weight="600" font-family="Inter, Microsoft YaHei, Segoe UI, sans-serif">健康 / 低队列</text>
      <rect x="640" y="224" width="220" height="58" rx="8" fill="#101b2d" stroke="#fb7185" opacity="1"/>
<text x="750" y="249" text-anchor="middle" fill="#f8fafc" font-size="15" font-weight="800" font-family="Inter, Microsoft YaHei, Segoe UI, sans-serif">Cluster B</text>
<text x="750" y="271" text-anchor="middle" fill="#93c5fd" font-size="12" font-weight="600" font-family="Inter, Microsoft YaHei, Segoe UI, sans-serif">高水位 / 降权</text>
      <rect x="224" y="318" width="210" height="40" rx="8" fill="#101b2d" stroke="#facc15" opacity="1"/>
<text x="329" y="343" text-anchor="middle" fill="#f8fafc" font-size="15" font-weight="800" font-family="Inter, Microsoft YaHei, Segoe UI, sans-serif">首 token 前：预算重试</text>

      <rect x="526" y="318" width="230" height="40" rx="8" fill="#101b2d" stroke="#fb7185" opacity="1"/>
<text x="641" y="343" text-anchor="middle" fill="#f8fafc" font-size="15" font-weight="800" font-family="Inter, Microsoft YaHei, Segoe UI, sans-serif">流式输出后：不透明重试</text>

    
  <text x="48" y="372" text-anchor="start" fill="#94a3b8" font-size="13" font-weight="500" font-family="Inter, Microsoft YaHei, Segoe UI, sans-serif">专家读图：网关路由要同时处理请求画像、指标新鲜度和流式重试边界。</text>
</svg>
