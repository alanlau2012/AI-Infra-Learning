<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-labelledby="title desc">
  <title id="title">可观测性体系 图解</title>
  <desc id="desc">可观测性不是多画几张大屏，而是让一次慢请求能从网关追到 NPU、从现象追到原因。</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#38bdf8"/>
    </marker>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
  </defs>
  <rect width="960" height="420" fill="url(#bg)"/>
  <rect x="24" y="24" width="912" height="372" rx="10" fill="#0b1220" stroke="#263143"/>
  <text x="48" y="70" text-anchor="start" fill="#5eead4" font-size="18" font-weight="900" font-family="Inter, Microsoft YaHei, Segoe UI, sans-serif">T14</text>
  <text x="98" y="70" text-anchor="start" fill="#f8fafc" font-size="22" font-weight="900" font-family="Inter, Microsoft YaHei, Segoe UI, sans-serif">可观测性体系</text>
  <text x="48" y="104" text-anchor="start" fill="#cbd5e1" font-size="15" font-weight="600" font-family="Inter, Microsoft YaHei, Segoe UI, sans-serif">可观测性不是多画几张大屏，而是让一次慢请求能从网关追到 NPU、从现象追到原因。</text>
  <rect x="742" y="42" width="166" height="30" rx="999" fill="#102033" stroke="#5eead4" opacity="1"/>
  <text x="825" y="63" text-anchor="middle" fill="#5eead4" font-size="12" font-weight="900" font-family="Inter, Microsoft YaHei, Segoe UI, sans-serif">专家读图：问题→机制→决策</text>
  
      <circle cx="480" cy="222" r="44" fill="#172554" stroke="#60a5fa" stroke-width="2"/>
<text x="480" y="227" text-anchor="middle" fill="#f8fafc" font-size="14" font-weight="800" font-family="Inter, Microsoft YaHei, Segoe UI, sans-serif">Trace</text>
      <circle cx="290" cy="276" r="44" fill="#422006" stroke="#facc15" stroke-width="2"/>
<text x="290" y="281" text-anchor="middle" fill="#f8fafc" font-size="14" font-weight="800" font-family="Inter, Microsoft YaHei, Segoe UI, sans-serif">Logs</text>
      <circle cx="670" cy="276" r="44" fill="#064e3b" stroke="#5eead4" stroke-width="2"/>
<text x="670" y="281" text-anchor="middle" fill="#f8fafc" font-size="14" font-weight="800" font-family="Inter, Microsoft YaHei, Segoe UI, sans-serif">Metrics</text>
      <path d="M 324 266 L 436 232" stroke="#38bdf8" stroke-width="3" fill="none"/><path d="M 524 232 L 636 266" stroke="#38bdf8" stroke-width="3" fill="none"/><path d="M 334 292 L 626 292" stroke="#38bdf8" stroke-width="3" fill="none"/>
      <rect x="380" y="128" width="200" height="44" rx="8" fill="#101b2d" stroke="#38bdf8" opacity="1"/>
<text x="480" y="146" text-anchor="middle" fill="#f8fafc" font-size="15" font-weight="800" font-family="Inter, Microsoft YaHei, Segoe UI, sans-serif">统一 request_id</text>
<text x="480" y="168" text-anchor="middle" fill="#93c5fd" font-size="12" font-weight="600" font-family="Inter, Microsoft YaHei, Segoe UI, sans-serif">串起一次慢请求</text>
      <path d="M 480 172 L 480 178" stroke="#38bdf8" stroke-width="3" marker-end="url(#arrow)" fill="none"/>
      <rect x="378" y="326" width="204" height="44" rx="8" fill="#101b2d" stroke="#a78bfa" opacity="1"/>
<text x="480" y="344" text-anchor="middle" fill="#f8fafc" font-size="15" font-weight="800" font-family="Inter, Microsoft YaHei, Segoe UI, sans-serif">Dashboard + Alert</text>
<text x="480" y="366" text-anchor="middle" fill="#93c5fd" font-size="12" font-weight="600" font-family="Inter, Microsoft YaHei, Segoe UI, sans-serif">证据驱动优化</text>
    
  <text x="48" y="372" text-anchor="start" fill="#94a3b8" font-size="13" font-weight="500" font-family="Inter, Microsoft YaHei, Segoe UI, sans-serif">专家读图：可观测性要把指标、日志和链路合成排障闭环。</text>
</svg>
