<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-labelledby="title desc">
  <title id="title">多租户资源治理 图解</title>
  <desc id="desc">多租户治理要解决的不是“谁能用”，而是“大家同时用时谁不该互相伤害”。</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#38bdf8"/>
    </marker>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
  </defs>
  <rect width="960" height="420" fill="url(#bg)"/>
  <rect x="24" y="24" width="912" height="372" rx="10" fill="#0b1220" stroke="#263143"/>
  <text x="48" y="70" text-anchor="start" fill="#5eead4" font-size="18" font-weight="900" font-family="Inter, Microsoft YaHei, Segoe UI, sans-serif">T15</text>
  <text x="98" y="70" text-anchor="start" fill="#f8fafc" font-size="22" font-weight="900" font-family="Inter, Microsoft YaHei, Segoe UI, sans-serif">多租户资源治理</text>
  <text x="48" y="104" text-anchor="start" fill="#cbd5e1" font-size="15" font-weight="600" font-family="Inter, Microsoft YaHei, Segoe UI, sans-serif">多租户治理要解决的不是“谁能用”，而是“大家同时用时谁不该互相伤害”。</text>
  
      <text x="90" y="178" text-anchor="start" fill="#dbe7f6" font-size="14" font-weight="900" font-family="Inter, Microsoft YaHei, Segoe UI, sans-serif">生产租户</text><rect x="210" y="150" width="460" height="38" rx="8" fill="#0f172a" stroke="#334155" opacity="1"/><rect x="210" y="150" width="390" height="38" rx="8" fill="#064e3b" stroke="#34d399" opacity="1"/><text x="690" y="176" text-anchor="start" fill="#cbd5e1" font-size="14" font-weight="500" font-family="Inter, Microsoft YaHei, Segoe UI, sans-serif">高优先级</text><text x="90" y="248" text-anchor="start" fill="#dbe7f6" font-size="14" font-weight="900" font-family="Inter, Microsoft YaHei, Segoe UI, sans-serif">研发租户</text><rect x="210" y="220" width="460" height="38" rx="8" fill="#0f172a" stroke="#334155" opacity="1"/><rect x="210" y="220" width="260" height="38" rx="8" fill="#172554" stroke="#60a5fa" opacity="1"/><text x="690" y="246" text-anchor="start" fill="#cbd5e1" font-size="14" font-weight="500" font-family="Inter, Microsoft YaHei, Segoe UI, sans-serif">弹性额度</text><text x="90" y="318" text-anchor="start" fill="#dbe7f6" font-size="14" font-weight="900" font-family="Inter, Microsoft YaHei, Segoe UI, sans-serif">压测租户</text><rect x="210" y="290" width="460" height="38" rx="8" fill="#0f172a" stroke="#334155" opacity="1"/><rect x="210" y="290" width="150" height="38" rx="8" fill="#422006" stroke="#facc15" opacity="1"/><text x="690" y="316" text-anchor="start" fill="#cbd5e1" font-size="14" font-weight="500" font-family="Inter, Microsoft YaHei, Segoe UI, sans-serif">隔离/限速</text>
      <rect x="310" y="336" width="340" height="38" rx="8" fill="#101b2d" stroke="#5eead4" opacity="1"/>
<text x="480" y="360" text-anchor="middle" fill="#f8fafc" font-size="15" font-weight="800" font-family="Inter, Microsoft YaHei, Segoe UI, sans-serif">计量维度：QPS + tokens + 上下文 + 并发</text>

    
  <text x="48" y="372" text-anchor="start" fill="#94a3b8" font-size="13" font-weight="500" font-family="Inter, Microsoft YaHei, Segoe UI, sans-serif">读图：多租户治理让共享资源可承诺、可计量、可隔离。</text>
</svg>
