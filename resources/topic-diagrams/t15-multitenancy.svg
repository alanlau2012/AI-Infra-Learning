<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-labelledby="title desc">
  <title id="title">多租户资源治理 图解</title>
  <desc id="desc">多租户治理要解决的不是“谁能用”，而是“大家同时用时谁不该互相伤害”。</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#38bdf8"/>
    </marker>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
  </defs>
  <rect width="960" height="420" fill="url(#bg)"/>
  <rect x="24" y="24" width="912" height="372" rx="10" fill="#0b1220" stroke="#263143"/>
  <text x="48" y="70" text-anchor="start" fill="#5eead4" font-size="18" font-weight="900" font-family="Inter, Microsoft YaHei, Segoe UI, sans-serif">T15</text>
  <text x="98" y="70" text-anchor="start" fill="#f8fafc" font-size="22" font-weight="900" font-family="Inter, Microsoft YaHei, Segoe UI, sans-serif">多租户资源治理</text>
  <text x="48" y="104" text-anchor="start" fill="#cbd5e1" font-size="15" font-weight="600" font-family="Inter, Microsoft YaHei, Segoe UI, sans-serif">多租户治理要解决的不是“谁能用”，而是“大家同时用时谁不该互相伤害”。</text>
  <rect x="742" y="42" width="166" height="30" rx="999" fill="#102033" stroke="#5eead4" opacity="1"/>
  <text x="825" y="63" text-anchor="middle" fill="#5eead4" font-size="12" font-weight="900" font-family="Inter, Microsoft YaHei, Segoe UI, sans-serif">专家读图：问题→机制→决策</text>
  
      <rect x="72" y="148" width="150" height="54" rx="8" fill="#101b2d" stroke="#60a5fa" opacity="1"/>
<text x="147" y="171" text-anchor="middle" fill="#f8fafc" font-size="15" font-weight="800" font-family="Inter, Microsoft YaHei, Segoe UI, sans-serif">Tenant Policy</text>
<text x="147" y="193" text-anchor="middle" fill="#93c5fd" font-size="12" font-weight="600" font-family="Inter, Microsoft YaHei, Segoe UI, sans-serif">保底/优先级</text>
      <path d="M 222 175 L 310 175" stroke="#38bdf8" stroke-width="3" marker-end="url(#arrow)" fill="none"/>
      <rect x="310" y="148" width="166" height="54" rx="8" fill="#101b2d" stroke="#5eead4" opacity="1"/>
<text x="393" y="171" text-anchor="middle" fill="#f8fafc" font-size="15" font-weight="800" font-family="Inter, Microsoft YaHei, Segoe UI, sans-serif">Token/KV Budget</text>
<text x="393" y="193" text-anchor="middle" fill="#93c5fd" font-size="12" font-weight="600" font-family="Inter, Microsoft YaHei, Segoe UI, sans-serif">长度/并发</text>
      <path d="M 476 175 L 564 175" stroke="#38bdf8" stroke-width="3" marker-end="url(#arrow)" fill="none"/>
      <rect x="564" y="148" width="160" height="54" rx="8" fill="#101b2d" stroke="#facc15" opacity="1"/>
<text x="644" y="171" text-anchor="middle" fill="#f8fafc" font-size="15" font-weight="800" font-family="Inter, Microsoft YaHei, Segoe UI, sans-serif">Admission</text>
<text x="644" y="193" text-anchor="middle" fill="#93c5fd" font-size="12" font-weight="600" font-family="Inter, Microsoft YaHei, Segoe UI, sans-serif">准入控制</text>
      <path d="M 644 202 L 644 254" stroke="#38bdf8" stroke-width="3" marker-end="url(#arrow)" fill="none"/>
      <rect x="564" y="254" width="160" height="54" rx="8" fill="#101b2d" stroke="#38bdf8" opacity="1"/>
<text x="644" y="277" text-anchor="middle" fill="#f8fafc" font-size="15" font-weight="800" font-family="Inter, Microsoft YaHei, Segoe UI, sans-serif">Scheduler Queue</text>
<text x="644" y="299" text-anchor="middle" fill="#93c5fd" font-size="12" font-weight="600" font-family="Inter, Microsoft YaHei, Segoe UI, sans-serif">WFQ/优先级</text>
      <path d="M 564 281 L 476 281" stroke="#38bdf8" stroke-width="3" marker-end="url(#arrow)" fill="none"/>
      <rect x="310" y="254" width="166" height="54" rx="8" fill="#101b2d" stroke="#a78bfa" opacity="1"/>
<text x="393" y="277" text-anchor="middle" fill="#f8fafc" font-size="15" font-weight="800" font-family="Inter, Microsoft YaHei, Segoe UI, sans-serif">Usage Accounting</text>
<text x="393" y="299" text-anchor="middle" fill="#93c5fd" font-size="12" font-weight="600" font-family="Inter, Microsoft YaHei, Segoe UI, sans-serif">token/KV/卡时</text>
      <path d="M 310 281 L 222 202" stroke="#38bdf8" stroke-width="3" marker-end="url(#arrow)" fill="none"/>
      <text x="480" y="348" text-anchor="middle" fill="#cbd5e1" font-size="14" font-weight="800" font-family="Inter, Microsoft YaHei, Segoe UI, sans-serif">治理闭环：策略 → 预算 → 准入 → 调度 → 计量 → 配额反馈</text>
    
  <text x="48" y="372" text-anchor="start" fill="#94a3b8" font-size="13" font-weight="500" font-family="Inter, Microsoft YaHei, Segoe UI, sans-serif">专家读图：多租户治理是 token/KV 预算与调度器准入的闭环。</text>
</svg>
