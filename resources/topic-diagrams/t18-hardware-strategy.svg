<text x="603.4349029814193" y="336.4640053362438" text-anchor="middle" fill="#f8fafc" font-size="15" font-weight="800" font-family="Inter, Microsoft YaHei, Segoe UI, sans-serif">软件栈</text>
<path d="M 480 236 L 356.5650970185807 331.4640053362438" stroke="#475569" stroke-width="2" fill="none"/><rect x="284.5650970185807" y="307.4640053362438" width="144" height="48" rx="8" fill="#101b2d" stroke="#fb7185" opacity="1"/>
<text x="356.5650970185807" y="336.4640053362438" text-anchor="middle" fill="#f8fafc" font-size="15" font-weight="800" font-family="Inter, Microsoft YaHei, Segoe UI, sans-serif">成本/SLA</text>
<path d="M 480 236 L 280.2781315780178 199.53599466375618" stroke="#475569" stroke-width="2" fill="none"/><rect x="208.2781315780178" y="175.53599466375618" width="144" height="48" rx="8" fill="#101b2d" stroke="#a78bfa" opacity="1"/>
<text x="280.2781315780178" y="204.53599466375618" text-anchor="middle" fill="#f8fafc" font-size="15" font-weight="800" font-family="Inter, Microsoft YaHei, Segoe UI, sans-serif">团队能力</text>

