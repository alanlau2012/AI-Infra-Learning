      <rect x="640" y="128" width="210" height="54" rx="8" fill="#101b2d" stroke="#facc15" opacity="1"/>
<text x="745" y="151" text-anchor="middle" fill="#f8fafc" font-size="15" font-weight="800" font-family="Inter, Microsoft YaHei, Segoe UI, sans-serif">表达力 vs 成本</text>
<text x="745" y="173" text-anchor="middle" fill="#93c5fd" font-size="12" font-weight="600" font-family="Inter, Microsoft YaHei, Segoe UI, sans-serif">不是单一路线通吃</text>
    
  <text x="48" y="372" text-anchor="start" fill="#94a3b8" font-size="13" font-weight="500" font-family="Inter, Microsoft YaHei, Segoe UI, sans-serif">专家读图：Attention 演进是在 KV 成本和精确回看能力之间取平衡。</text>
</svg>
