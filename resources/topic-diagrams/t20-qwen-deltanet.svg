<svg xmlns="http://www.w3.org/2000/svg" width="960" height="460" viewBox="0 0 960 460" role="img" aria-labelledby="title desc">
  <title id="title">Gated DeltaNet 混合架构：Qwen3-Next-80B-A3B 的实现 图解</title>
  <desc id="desc">Qwen3-Next-80B-A3B 共 48 层，按 12 × (3 个 Gated DeltaNet → MoE + 1 个 Gated Attention → MoE) 排布；图中只画 4 块作为示意，实际为 12 块。</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#38bdf8"/>
    </marker>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
  </defs>
  <rect width="960" height="460" fill="url(#bg)"/>
  <rect x="24" y="24" width="912" height="412" rx="10" fill="#0b1220" stroke="#263143"/>

  <text x="48" y="70" text-anchor="start" fill="#5eead4" font-size="18" font-weight="900" font-family="Inter, Microsoft YaHei, Segoe UI, sans-serif">T20</text>
  <text x="98" y="70" text-anchor="start" fill="#f8fafc" font-size="22" font-weight="900" font-family="Inter, Microsoft YaHei, Segoe UI, sans-serif">Gated DeltaNet 混合架构：Qwen3-Next-80B-A3B 的实现</text>
  <text x="48" y="100" text-anchor="start" fill="#cbd5e1" font-size="14" font-weight="600" font-family="Inter, Microsoft YaHei, Segoe UI, sans-serif">Qwen3-Next-80B-A3B：48 层 = 12 ×（3 × Gated DeltaNet → MoE + 1 × Gated Attention → MoE）</text>
  <text x="48" y="120" text-anchor="start" fill="#94a3b8" font-size="12" font-weight="500" font-family="Inter, Microsoft YaHei, Segoe UI, sans-serif">图中只画 4 块（共 16 层）以保可读，实际 ×12 块（共 48 层）。每块 3 层线性注意力 + 1 层全注意力。</text>

  <rect x="742" y="42" width="166" height="30" rx="999" fill="#102033" stroke="#5eead4" opacity="1"/>
  <text x="825" y="63" text-anchor="middle" fill="#5eead4" font-size="12" font-weight="900" font-family="Inter, Microsoft YaHei, Segoe UI, sans-serif">专家读图：问题→机制→决策</text>

  <text x="480" y="160" text-anchor="middle" fill="#f8fafc" font-size="16" font-weight="900" font-family="Inter, Microsoft YaHei, Segoe UI, sans-serif">3 : 1 混合层（每块）：3 个 Gated DeltaNet + 1 个 Gated Attention</text>

  <rect x="60" y="180" width="180" height="158" rx="8" fill="#0f172a" stroke="#334155" opacity="1"/>
  <rect x="80" y="204" width="32" height="84" rx="5" fill="#064e3b" stroke="#34d399" opacity="1"/>
  <rect x="118" y="204" width="32" height="84" rx="5" fill="#064e3b" stroke="#34d399" opacity="1"/>
  <rect x="156" y="204" width="32" height="84" rx="5" fill="#064e3b" stroke="#34d399" opacity="1"/>
  <rect x="194" y="204" width="32" height="84" rx="5" fill="#172554" stroke="#60a5fa" opacity="1"/>
  <text x="134" y="312" text-anchor="middle" fill="#bbf7d0" font-size="12" font-weight="800" font-family="Inter, Microsoft YaHei, Segoe UI, sans-serif">3 × Gated DeltaNet</text>
  <text x="210" y="312" text-anchor="middle" fill="#bfdbfe" font-size="12" font-weight="800" font-family="Inter, Microsoft YaHei, Segoe UI, sans-serif">1 × Gated Attn</text>
  <text x="150" y="328" text-anchor="middle" fill="#94a3b8" font-size="11" font-weight="600" font-family="Inter, Microsoft YaHei, Segoe UI, sans-serif">块 1（层 1–4）</text>

  <rect x="260" y="180" width="180" height="158" rx="8" fill="#0f172a" stroke="#334155" opacity="1"/>
  <rect x="280" y="204" width="32" height="84" rx="5" fill="#064e3b" stroke="#34d399" opacity="1"/>
  <rect x="318" y="204" width="32" height="84" rx="5" fill="#064e3b" stroke="#34d399" opacity="1"/>
  <rect x="356" y="204" width="32" height="84" rx="5" fill="#064e3b" stroke="#34d399" opacity="1"/>
  <rect x="394" y="204" width="32" height="84" rx="5" fill="#172554" stroke="#60a5fa" opacity="1"/>
  <text x="334" y="312" text-anchor="middle" fill="#bbf7d0" font-size="12" font-weight="800" font-family="Inter, Microsoft YaHei, Segoe UI, sans-serif">3 × Gated DeltaNet</text>
  <text x="410" y="312" text-anchor="middle" fill="#bfdbfe" font-size="12" font-weight="800" font-family="Inter, Microsoft YaHei, Segoe UI, sans-serif">1 × Gated Attn</text>
  <text x="350" y="328" text-anchor="middle" fill="#94a3b8" font-size="11" font-weight="600" font-family="Inter, Microsoft YaHei, Segoe UI, sans-serif">块 2（层 5–8）</text>

  <rect x="460" y="180" width="180" height="158" rx="8" fill="#0f172a" stroke="#334155" opacity="1"/>
  <rect x="480" y="204" width="32" height="84" rx="5" fill="#064e3b" stroke="#34d399" opacity="1"/>
  <rect x="518" y="204" width="32" height="84" rx="5" fill="#064e3b" stroke="#34d399" opacity="1"/>
  <rect x="556" y="204" width="32" height="84" rx="5" fill="#064e3b" stroke="#34d399" opacity="1"/>
  <rect x="594" y="204" width="32" height="84" rx="5" fill="#172554" stroke="#60a5fa" opacity="1"/>
  <text x="534" y="312" text-anchor="middle" fill="#bbf7d0" font-size="12" font-weight="800" font-family="Inter, Microsoft YaHei, Segoe UI, sans-serif">3 × Gated DeltaNet</text>
  <text x="610" y="312" text-anchor="middle" fill="#bfdbfe" font-size="12" font-weight="800" font-family="Inter, Microsoft YaHei, Segoe UI, sans-serif">1 × Gated Attn</text>
  <text x="550" y="328" text-anchor="middle" fill="#94a3b8" font-size="11" font-weight="600" font-family="Inter, Microsoft YaHei, Segoe UI, sans-serif">块 3（层 9–12）</text>

  <rect x="660" y="180" width="180" height="158" rx="8" fill="#0f172a" stroke="#334155" opacity="1" stroke-dasharray="4 4"/>
  <rect x="680" y="204" width="32" height="84" rx="5" fill="#064e3b" stroke="#34d399" opacity="0.55"/>
  <rect x="718" y="204" width="32" height="84" rx="5" fill="#064e3b" stroke="#34d399" opacity="0.55"/>
  <rect x="756" y="204" width="32" height="84" rx="5" fill="#064e3b" stroke="#34d399" opacity="0.55"/>
  <rect x="794" y="204" width="32" height="84" rx="5" fill="#172554" stroke="#60a5fa" opacity="0.55"/>
  <text x="750" y="312" text-anchor="middle" fill="#94a3b8" font-size="12" font-weight="800" font-family="Inter, Microsoft YaHei, Segoe UI, sans-serif">… 共 12 块（48 层）</text>
  <text x="750" y="328" text-anchor="middle" fill="#94a3b8" font-size="11" font-weight="600" font-family="Inter, Microsoft YaHei, Segoe UI, sans-serif">虚线表示省略 9 个块</text>

  <rect x="60" y="356" width="380" height="56" rx="8" fill="#101b2d" stroke="#34d399" opacity="1"/>
  <text x="250" y="378" text-anchor="middle" fill="#f8fafc" font-size="13" font-weight="800" font-family="Inter, Microsoft YaHei, Segoe UI, sans-serif">Gated DeltaNet × 36 层（占 75%）</text>
  <text x="250" y="397" text-anchor="middle" fill="#bbf7d0" font-size="12" font-weight="500" font-family="Inter, Microsoft YaHei, Segoe UI, sans-serif">32 V / 16 QK heads · head dim 128 · 固定状态 S</text>

  <rect x="460" y="356" width="380" height="56" rx="8" fill="#101b2d" stroke="#60a5fa" opacity="1"/>
  <text x="650" y="378" text-anchor="middle" fill="#f8fafc" font-size="13" font-weight="800" font-family="Inter, Microsoft YaHei, Segoe UI, sans-serif">Gated Attention × 12 层（占 25%）</text>
  <text x="650" y="397" text-anchor="middle" fill="#bfdbfe" font-size="12" font-weight="500" font-family="Inter, Microsoft YaHei, Segoe UI, sans-serif">16 Q / 2 KV heads · head dim 256 · 传统 KV Cache</text>

  <text x="48" y="430" text-anchor="start" fill="#94a3b8" font-size="13" font-weight="500" font-family="Inter, Microsoft YaHei, Segoe UI, sans-serif">专家读图：Qwen3-Next 把长上下文 KV 成本集中到 12 层 Gated Attention，其余 36 层用固定状态替代逐 token KV。</text>
</svg>
